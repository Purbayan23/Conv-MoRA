# @package dataset
name: isic2016
adapter: isic2016
task: binary_segmentation
version: "2016"
split_definition_name: generated_from_official_training_seed42
image_color_space: rgb
input_channels: 3
num_classes: 1
raw_mask_values: [0, 255]
common_mask_values: [0, 1]
sample_id_format: filename_stem
root: ${oc.env:MEDSEG_DATA_ROOT,./data/isic2016}
train_val_ratio: 0.8
split_seed: 42
metadata_keys:
  - dataset_name
  - dataset_version
  - split
  - source_image_path
  - source_mask_path
  - original_spatial_shape
  - split_manifest
splits:
  train:
    name: train
    images_dir: ${dataset.root}/ISBI2016_ISIC_Part1_Training_Data/ISBI2016_ISIC_Part1_Training_Data
    masks_dir: ${dataset.root}/ISBI2016_ISIC_Part1_Training_GroundTruth/ISBI2016_ISIC_Part1_Training_GroundTruth
    manifest_path: ${dataset.root}/splits/train.csv
    definition_source: generated_from_official_training
  val:
    name: val
    images_dir: ${dataset.root}/ISBI2016_ISIC_Part1_Training_Data/ISBI2016_ISIC_Part1_Training_Data
    masks_dir: ${dataset.root}/ISBI2016_ISIC_Part1_Training_GroundTruth/ISBI2016_ISIC_Part1_Training_GroundTruth
    manifest_path: ${dataset.root}/splits/val.csv
    definition_source: generated_from_official_training
  test:
    name: test
    images_dir: ${dataset.root}/ISBI2016_ISIC_Part1_Test_Data
    masks_dir: ${dataset.root}/ISBI2016_ISIC_Part1_Test_GroundTruth
    manifest_path: ${dataset.root}/splits/test.csv
    definition_source: official_test
loader:
  batch_size: 4
  num_workers: 2
  pin_memory: true
  persistent_workers: false
